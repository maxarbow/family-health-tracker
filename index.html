<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Health Record</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2E4A52" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Health Record" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper: #EFE8D8;
    --paper-light: #FAF7EE;
    --ink: #2A251E;
    --ink-soft: #7A7061;
    --line: #DDD1B4;
    --teal: #2E4A52;
    --teal-dark: #21363C;
    --teal-tint: #DDE6E4;

    --illness: #AD4C4C;
    --illness-bg: #F2E0DC;
    --appt: #B47F26;
    --appt-bg: #F3E5C4;
    --med: #5B7A45;
    --med-bg: #E2E8D2;
    --vax: #3D7089;
    --vax-bg: #DAE7EB;
    --growth: #7C5C82;
    --growth-bg: #E8DEEA;

    --radius: 10px;
  }

  [data-theme="dark"]{
    --paper: #1D2321;
    --paper-light: #262E2B;
    --ink: #EDE8DC;
    --ink-soft: #9BA39C;
    --line: #3A443F;
    --teal: #6FA79C;
    --teal-dark: #8FC2B6;
    --teal-tint: #2E3D39;
    --illness-bg: #3A2624;
    --appt-bg: #3A3220;
    --med-bg: #263223;
    --vax-bg: #202F35;
    --growth-bg: #2E2432;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body{ height: 100%; margin: 0; }
  #fht-root, #fht-root *{ box-sizing: border-box; }

  #fht-root{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0 0 48px 0;
  }

  #fht-root h1, #fht-root h2, #fht-root h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  #fht-root button{ font-family: inherit; }
  #fht-root input, #fht-root select, #fht-root textarea{ font-family: inherit; font-size: 14.5px; }

  #fht-root :focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  .fht-btn{
    border: 1px solid var(--line);
    background: var(--paper-light);
    color: var(--ink);
    padding: 9px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .fht-btn:hover{ border-color: var(--ink-soft); }
  .fht-btn-primary{
    background: var(--teal);
    border-color: var(--teal);
    color: var(--paper-light);
  }
  .fht-btn-primary:hover{ background: var(--teal-dark); }
  .fht-btn-primary:disabled{ opacity: 0.5; cursor: not-allowed; }
  .fht-btn-text{
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 6px 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
  }
  .fht-btn-text:hover{ color: var(--ink); }
  .fht-btn-danger{ color: var(--illness); }

  /* ---------- Gate / Onboarding ---------- */
  .fht-onboard-wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 20px;
  }
  .fht-onboard-card{
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px 32px;
  }
  .fht-onboard-card h1{ font-size: 26px; margin-bottom: 8px; }
  .fht-onboard-card p.fht-sub{ color: var(--ink-soft); margin: 0 0 26px 0; font-size: 14.5px; }
  .fht-field{ margin-bottom: 18px; }
  .fht-field label{ display:block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--ink-soft); }
  .fht-field input[type=text], .fht-field input[type=date], .fht-field select, .fht-field textarea{
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .fht-field textarea{ resize: vertical; min-height: 60px; }

  .fht-choice-row{ display:flex; gap: 14px; margin-bottom: 8px; }
  .fht-choice{
    flex: 1;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 18px 16px;
    cursor: pointer;
    text-align: left;
  }
  .fht-choice:hover{ border-color: var(--teal); }
  .fht-choice h3{ font-size: 16px; margin-bottom: 6px; }
  .fht-choice p{ font-size: 13px; color: var(--ink-soft); margin: 0; }

  .fht-code-display{
    display:flex; align-items:center; gap: 10px;
    background: var(--teal-tint); border-radius: 10px; padding: 14px 16px; margin: 14px 0 20px 0;
  }
  .fht-code-display .fht-code{
    font-family: 'Fraunces', serif; font-size: 22px; letter-spacing: 2px; font-weight: 600; color: var(--teal-dark);
  }

  .fht-member-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .fht-member-row input[type=text]{ flex: 1; }
  .fht-swatch-row{ display:flex; gap: 6px; }
  .fht-swatch{
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .fht-swatch.selected{ border-color: var(--ink); }
  .fht-remove-row{
    border: none; background: transparent; color: var(--ink-soft);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 6px;
  }
  .fht-remove-row:hover{ color: var(--illness); }
  .fht-error{ color: var(--illness); font-size: 13px; margin: 4px 0 0 0; }
  .fht-note{ color: var(--ink-soft); font-size: 12.5px; margin-top: 6px; }

  /* ---------- Header ---------- */
  .fht-header{
    background: var(--paper-light);
    border-bottom: 1px solid var(--line);
    padding: 22px 32px 18px 32px;
  }
  .fht-header-top{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    max-width: 1180px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  .fht-header-top h1{ font-size: 25px; }
  .fht-header-top .fht-tag{ color: var(--ink-soft); font-size: 13.5px; margin-top: 4px; }
  .fht-header-top .fht-tag button{ border:none; background:none; color:var(--teal); cursor:pointer; font-weight:600; font-size:12.5px; padding:0; margin-left: 8px; }
  .fht-header-actions{ display:flex; gap: 10px; flex-wrap: wrap; }

  .fht-pills{
    max-width: 1180px;
    margin: 16px auto 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .fht-pill{
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    background: var(--paper-light);
    padding: 6px 13px 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .fht-pill .fht-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .fht-pill.active{ background: var(--teal); color: var(--paper-light); border-color: var(--teal); }
  .fht-pill.active .fht-dot{ box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }
  .fht-preset-pill{
    border: 1px dashed var(--line); background: none; color: var(--ink-soft);
    padding: 5px 12px; border-radius: 999px; cursor:pointer; font-size: 12.5px; font-weight:600; white-space:nowrap;
  }
  .fht-preset-pill:hover{ border-color: var(--illness); color: var(--illness); }
  .fht-preset-label{ font-size: 12px; color: var(--ink-soft); align-self:center; margin-right:2px; }
  .fht-search-row{ display:flex; gap:8px; margin-bottom: 14px; }
  .fht-search-row input[type=text]{ flex:1; padding: 8px 11px; border:1px solid var(--line); border-radius: 8px; background:#fff; color:var(--ink); }
  [data-theme="dark"] .fht-search-row input[type=text],
  [data-theme="dark"] .fht-search-row select,
  [data-theme="dark"] .fht-field input, [data-theme="dark"] .fht-field select, [data-theme="dark"] .fht-field textarea,
  [data-theme="dark"] .fht-people-row input, [data-theme="dark"] .fht-care-grid input, [data-theme="dark"] .fht-birthdate-row input{
    background: var(--paper); color: var(--ink);
  }
  .fht-search-row select{ padding: 8px 10px; border:1px solid var(--line); border-radius: 8px; background:#fff; color:var(--ink); }

  /* ---------- Stats ledger ---------- */
  .fht-stats{
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 32px 0 32px;
    display: flex;
  }
  .fht-stat{
    flex: 1;
    padding: 0 22px;
    border-left: 1px solid var(--line);
  }
  .fht-stat:first-child{ border-left: none; padding-left: 0; }
  .fht-stat .fht-num{ font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; display:block; line-height:1; }
  .fht-stat .fht-lbl{ color: var(--ink-soft); font-size: 12.5px; margin-top: 6px; display:block; }

  /* ---------- Main grid ---------- */
  .fht-main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 32px 0 32px;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 36px;
  }
  @media (max-width: 900px){
    .fht-main{ grid-template-columns: 1fr; }
    .fht-stats{ flex-wrap: wrap; }
    .fht-stat{ flex: 1 1 45%; border-left: none; padding-left: 0; margin-bottom: 14px; }
    .fht-choice-row{ flex-direction: column; }
  }

  .fht-section-head{
    display:flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
  }
  .fht-section-head h2{ font-size: 15px; font-weight: 600; color: var(--ink-soft); font-family:'Inter',sans-serif; }

  .fht-month-head{
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    margin: 22px 0 8px 0; display:flex; align-items:center; gap:10px;
  }
  .fht-month-head:first-child{ margin-top: 0; }
  .fht-month-head::after{ content:''; flex:1; height:1px; background: var(--line); }

  .fht-entry{
    display:flex;
    gap: 12px;
    padding: 12px 10px 12px 14px;
    border-left: 3px solid var(--type-color, var(--line));
    border-radius: 6px;
    cursor: pointer;
    position: relative;
  }
  .fht-entry:hover{ background: var(--paper-light); }
  .fht-entry .fht-shape{ font-size: 13px; color: var(--type-color); margin-top: 3px; flex-shrink:0; }
  .fht-entry-body{ flex: 1; min-width: 0; }
  .fht-entry-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .fht-entry-title{ font-weight: 600; }
  .fht-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color: var(--ink-soft); }
  .fht-chip .fht-dot{ width:7px; height:7px; border-radius:50%; }
  .fht-entry-date{ margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
  .fht-entry-detail{ font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .fht-entry-notes{ font-size: 13px; color: var(--ink-soft); margin-top: 2px; font-style: italic; }
  .fht-entry-del{
    background: transparent; border: none; color: var(--ink-soft);
    font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 8px;
    border-radius: 6px; align-self: flex-start; flex-shrink: 0;
  }
  .fht-entry-del:hover{ background: var(--illness-bg); color: var(--illness); }

  .fht-empty{
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 26px;
    font-size: 14px;
  }

  .fht-panel{
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 22px;
  }
  .fht-legend{ display:flex; flex-wrap:wrap; gap: 12px; margin-top: 10px; }
  .fht-legend-item{ display:flex; align-items:center; gap:6px; font-size: 12.5px; color: var(--ink-soft); }
  .fht-legend-item .fht-dot{ width:8px; height:8px; border-radius:2px; }

  .fht-remind-item{
    display:flex; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .fht-remind-item:last-child{ border-bottom: none; }
  .fht-remind-item .fht-r-date{ color: var(--ink-soft); font-size: 12.5px; white-space:nowrap; }

  /* ---------- Modal ---------- */
  .fht-overlay{
    position: fixed; inset: 0; background: rgba(30,26,20,0.45);
    display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 1000;
  }
  .fht-modal{
    background: var(--paper-light);
    border-radius: 16px;
    padding: 28px 28px 22px 28px;
    max-width: 480px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .fht-modal h2{ font-size: 20px; margin-bottom: 18px; }
  .fht-type-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 20px; }
  .fht-type-opt{
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 6px; text-align:center; cursor:pointer; font-size: 12px; font-weight: 600;
    color: var(--ink-soft);
  }
  .fht-type-opt .fht-shape{ display:block; font-size: 16px; margin-bottom: 4px; }
  .fht-type-opt.selected{ border-color: var(--type-color); background: var(--type-bg); color: var(--type-color); }
  .fht-modal-actions{ display:flex; align-items:center; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .fht-modal-actions .fht-left{ margin-right: auto; }

  .fht-people-list{ margin-bottom: 16px; }
  .fht-people-row{ display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
  .fht-people-row input[type=text]{ flex:1; padding: 8px 10px; border:1px solid var(--line); border-radius: 8px; }

  .fht-loading{ padding: 80px 20px; text-align:center; color: var(--ink-soft); }

  /* ---------- Header dropdown (Data menu) ---------- */
  .fht-dropdown-wrap{ position: relative; }
  .fht-dropdown{
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--paper-light); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(30,26,20,0.12); min-width: 220px; padding: 6px; z-index: 200;
  }
  .fht-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding: 9px 10px; border-radius: 7px; cursor:pointer; font-size: 13.5px; color: var(--ink);
  }
  .fht-dropdown button:hover{ background: var(--teal-tint); }
  .fht-dropdown hr{ border:none; border-top:1px solid var(--line); margin: 6px 2px; }

  /* ---------- Photos ---------- */
  .fht-thumb{
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--line); cursor: pointer; flex-shrink: 0;
  }
  .fht-photo-preview{ margin-top: 8px; display:flex; align-items:center; gap:10px; }
  .fht-photo-preview img{ width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border:1px solid var(--line); }
  .fht-doc-thumb{ display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--paper); text-decoration:none; }
  .fht-doc-chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; text-decoration:none; color:var(--teal); font-weight:600; font-size:13px; }
  .fht-lightbox{
    position: fixed; inset:0; background: rgba(20,17,13,0.85); z-index: 1100;
    display:flex; align-items:center; justify-content:center; padding: 24px; cursor: zoom-out;
  }
  .fht-lightbox img{ max-width: 92vw; max-height: 92vh; border-radius: 10px; }

  /* ---------- Growth panel ---------- */
  .fht-growth-stat{ display:flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
  .fht-growth-stat div{ font-size: 12.5px; color: var(--ink-soft); }
  .fht-growth-stat span{ display:block; font-family:'Fraunces', serif; font-size: 20px; color: var(--ink); font-weight:600; }

  /* ---------- Vaccine schedule ---------- */
  .fht-vax-row{
    display:flex; justify-content: space-between; align-items:center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .fht-vax-row:last-child{ border-bottom:none; }
  .fht-vax-name{ font-weight: 600; font-size: 13.5px; }
  .fht-vax-sub{ font-size: 12px; color: var(--ink-soft); margin-top:2px; }
  .fht-badge{ font-size: 11.5px; font-weight:700; padding: 3px 9px; border-radius: 999px; white-space:nowrap; }
  .fht-badge-done{ background: var(--med-bg); color: var(--med); }
  .fht-badge-due{ background: var(--appt-bg); color: var(--appt); }
  .fht-badge-overdue{ background: var(--illness-bg); color: var(--illness); }
  .fht-badge-future{ background: var(--teal-tint); color: var(--teal); }

  /* ---------- Care team fields inside People modal ---------- */
  .fht-care-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 14px 46px; }
  .fht-care-grid input{ padding: 7px 9px; border:1px solid var(--line); border-radius: 7px; font-size: 13px; }
  .fht-people-block{ border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  .fht-people-block:last-child{ border-bottom:none; }
  .fht-care-toggle{ margin-left: 46px; font-size:12px; color:var(--teal); background:none; border:none; cursor:pointer; font-weight:600; padding: 2px 0; }
  .fht-birthdate-row{ margin: 8px 0 4px 46px; display:flex; align-items:center; gap:8px; }
  .fht-birthdate-row label{ font-size:12px; color:var(--ink-soft); }
  .fht-birthdate-row input{ padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13px; }

  .fht-condition-tags{ margin: 8px 0 6px 46px; display:flex; flex-wrap:wrap; gap:6px; }
  .fht-condition-tag{
    display:inline-flex; align-items:center; gap:6px; padding: 4px 6px 4px 10px; border-radius:999px; font-size:12px; font-weight:600;
  }
  .fht-condition-allergy{ background: var(--illness-bg); color: var(--illness); }
  .fht-condition-condition{ background: var(--teal-tint); color: var(--teal); }
  .fht-condition-remove{ border:none; background:none; cursor:pointer; font-size:13px; color:inherit; opacity:0.7; padding:0 2px; }
  .fht-condition-remove:hover{ opacity:1; }
  .fht-condition-add{ display:flex; gap:6px; margin: 0 0 10px 46px; }
  .fht-condition-add select{ padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; }
  .fht-condition-add input{ flex:1; padding:6px 9px; border:1px solid var(--line); border-radius:7px; font-size:12.5px; }

  .fht-alert-banner{
    max-width: 1180px; margin: 12px auto 0 auto; padding: 10px 32px;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  }
  .fht-alert-banner .fht-alert-label{ font-size:12.5px; font-weight:700; color:var(--illness); margin-right:4px; }
  .fht-readonly-banner{
    max-width:1180px; margin:10px auto 0 auto; padding: 8px 32px;
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }

  @media print{
    body *{ visibility: hidden; }
    #fht-print-area, #fht-print-area *{ visibility: visible; }
    #fht-print-area{ position: absolute; left:0; top:0; width:100%; padding: 20px; }
    .fht-print-title{ font-family:'Fraunces',serif; font-size: 22px; margin-bottom:4px; }
    .fht-print-sub{ color:#666; font-size:12px; margin-bottom:18px; }
    .fht-print-entry{ padding: 6px 0; border-bottom: 1px solid #ccc; font-size: 12.5px; }
  }
  #fht-print-area{ display:none; }
</style>
</head>
<body>
<div id="fht-root"><div class="fht-loading">Loading your family's record…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, deleteDoc, onSnapshot, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged

  function unitSuffix(){ return state.household.measurementUnits==='metric' ? { h:'cm', w:'kg' } : { h:'in', w:'lb' }; }

  function toKg(v, units){ return units==='metric' ? v : v*0.453592; }
  function fromCm(cm, units){ return units==='metric' ? cm : cm/2.54; }
  function fromKg(kg, units){ return units==='metric' ? kg : kg/0.453592; }

  let state = { code: null, household: null, events: [], activeFilter: 'all', searchQuery: '', typeFilter: 'all', readOnly: false };

  const googleProvider = new GoogleAuthProvider();
  function signIn(){
    signInWithPopup(auth, googleProvider).catch(err=>{
      console.error(err);
      alert('Sign-in failed — this can happen if pop-ups are blocked, or if this site\u2019s domain hasn\u2019t been added to Firebase\u2019s authorized domains yet.');
    });
  }
  function signOutUser(){ signOut(auth).catch(()=>{}); }
  onAuthStateChanged(auth, (user)=>{
    currentUser = user;
    if(state.household) renderApp();
  });
  let modalState = null;
  let modalDeleteArm = false;
  let peopleDraft = null;
  let onboardDraft = null;
  let charts = { monthly: null, second: null };
  let unsubHousehold = null, unsubEvents = null;

  function uidLocal(){ return 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }
  function fmtMonthHead(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  }
  function getMember(id){
    const m = state.household.members.find(x=>x.id===id);
    return m || { id, name:'Former member', color:'#9C9285' };
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function generateCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out=''; for(let i=0;i<8;i++) out+=chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function joinURL(code){
    return `${location.origin}${location.pathname}?code=${code}`;
  }
  function renderQR(elId, text){
    const el = document.getElementById(elId);
    if(!el || typeof QRCode==='undefined') return;
    el.innerHTML = '';
    new QRCode(el, { text, width:96, height:96, colorDark:'#2E4A52', colorLight:'#ffffff' });
  }

  /* ---------------- Firestore helpers ---------------- */
  function householdRef(code){ return doc(db, 'households', code); }
  function eventsRef(code){ return collection(db, 'households', code, 'events'); }
  function eventRef(code, id){ return doc(db, 'households', code, 'events', id); }

  async function createHousehold(code, householdData){
    await setDoc(householdRef(code), householdData);
  }
  async function saveHouseholdRemote(){
    await setDoc(householdRef(state.code), state.household, { merge: true });
  }
  async function addEventRemote(fields){
    return await addDoc(eventsRef(state.code), { ...fields, createdAt: Date.now() });
  }
  async function updateEventRemote(id, fields){
    await updateDoc(eventRef(state.code, id), fields);
  }
  async function deleteEventRemote(id){
    await deleteDoc(eventRef(state.code, id));
  }

  function startListening(){
    if(unsubHousehold) unsubHousehold();
    if(unsubEvents) unsubEvents();
    unsubHousehold = onSnapshot(householdRef(state.code), snap=>{
      if(!snap.exists()){
        state.household = null;
        localStorage.removeItem(CODE_KEY);
        renderGate('missing');
        return;
      }
      state.household = snap.data();
      if(!state.household.measurementUnits) state.household.measurementUnits = 'imperial';
      if(state.household.viewOnlyCode===undefined) state.household.viewOnlyCode = null;
      state.household.members.forEach(m=>{ if(m.birthdate===undefined) m.birthdate=null; if(!m.care) m.care={}; if(!m.conditions) m.conditions=[]; });
      if(state.activeFilter!=='all' && !state.household.members.find(m=>m.id===state.activeFilter)){
        state.activeFilter = 'all';
      }
      renderApp();
    }, err=>{
      console.error(err);
      renderGate('error');
    });
    unsubEvents = onSnapshot(eventsRef(state.code), snap=>{
      state.events = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      if(state.household) renderApp();
    }, err=>console.error(err));
  }

  function switchFamily(){
    if(unsubHousehold) unsubHousehold();
    if(unsubEvents) unsubEvents();
    localStorage.removeItem(CODE_KEY);
    localStorage.removeItem(READONLY_KEY);
    state = { code:null, household:null, events:[], activeFilter:'all', searchQuery:'', typeFilter:'all', readOnly:false };
    renderGate();
  }

        <div class="fht-onboard-wrap"><div class="fht-onboard-card">
          <h1>We couldn't find that family</h1>
          <p class="fht-sub">The family code saved on this device doesn't match a record anymore.</p>
          <button class="fht-btn fht-btn-primary" id="fht-gate-restart">Start over</button>
        </div></div>`;
      document.getElementById('fht-gate-restart').addEventListener('click', ()=>{ localStorage.removeItem(CODE_KEY); renderGate(); });
      return;
    }
    if(mode==='error'){
      root.innerHTML = `
        <div class="fht-onboard-wrap"><div class="fht-onboard-card">
          <h1>Couldn't connect</h1>
          <p class="fht-sub">Check that the Firebase config at the top of index.html has been filled in, and that Firestore rules allow access. See README.md.</p>
        </div></div>`;
      return;

    root.innerHTML = `
      <div class="fht-onboard-wrap">
        <div class="fht-onboard-card">
          <h1>Family Health Record</h1>
          <p class="fht-sub">Track illnesses, appointments, medications and vaccines for your household — synced across every family member's device.</p>
          <div class="fht-choice-row">
            <button class="fht-choice" id="fht-gate-create" type="button">
              <h3>Start a new family record</h3>
              <p>You'll get a family code to share with the rest of your household.</p>
            </button>
            <button class="fht-choice" id="fht-gate-join" type="button">
              <h3>Join an existing family</h3>
              <p>Enter the family code someone in your household already has.</p>
            </button>
          </div>
        </div>
      </div>`;
    document.getElementById('fht-gate-create').addEventListener('click', renderOnboarding);
    document.getElementById('fht-gate-join').addEventListener('click', renderJoin);
  }

  function renderJoin(){
    root.innerHTML = `
      <div class="fht-onboard-wrap"><div class="fht-onboard-card">
        <h1>Join your family's record</h1>
        <p class="fht-sub">Enter the family code shared with you.</p>
        <div class="fht-field">
          <label for="fht-join-code">Family code</label>
          <input type="text" id="fht-join-code" placeholder="e.g. 7F3KQ9XM" style="text-transform:uppercase; letter-spacing:1px;" />
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:14px;">
          <input type="checkbox" id="fht-join-viewonly" /> This is a view-only code
        </label>
        <p class="fht-error" id="fht-join-error" style="display:none;"></p>
        <div style="display:flex; gap:10px;">
          <button class="fht-btn" id="fht-join-back">Back</button>
          <button class="fht-btn fht-btn-primary" id="fht-join-submit">Join</button>
        </div>
      </div></div>`;
    document.getElementById('fht-join-back').addEventListener('click', ()=>renderGate());
    document.getElementById('fht-join-submit').addEventListener('click', async ()=>{
      const input = document.getElementById('fht-join-code');
      const errEl = document.getElementById('fht-join-error');
      const isViewOnly = document.getElementById('fht-join-viewonly').checked;
      const code = input.value.trim().toUpperCase();
      if(!code){ errEl.textContent = 'Please enter a family code.'; errEl.style.display='block'; return; }
      try{
        if(isViewOnly){
          const voSnap = await getDoc(doc(db,'viewOnlyCodes',code));
          if(!voSnap.exists()){
            errEl.textContent = "We couldn't find a view-only code matching that. Double-check it and try again.";
            errEl.style.display = 'block';
            return;
          }
          const familyCode = voSnap.data().familyCode;
          const hSnap = await getDoc(householdRef(familyCode));
          if(!hSnap.exists()){
            errEl.textContent = "That view-only code points to a family that no longer exists.";
            errEl.style.display = 'block';
            return;
          }
          state.code = familyCode;
          state.readOnly = true;
          localStorage.setItem(CODE_KEY, familyCode);
          localStorage.setItem(READONLY_KEY, '1');
          root.innerHTML = `<div class="fht-loading">Joining your family's record…</div>`;
          startListening();
          return;
        }
        const snap = await getDoc(householdRef(code));
        if(!snap.exists()){
          errEl.textContent = "We couldn't find a family with that code. Double-check it and try again.";
          errEl.style.display = 'block';
          return;
        }
        state.code = code;
        state.readOnly = false;
        localStorage.setItem(CODE_KEY, code);
        localStorage.removeItem(READONLY_KEY);
        root.innerHTML = `<div class="fht-loading">Joining your family's record…</div>`;
        startListening();
      } catch(e){
        console.error(e);
        errEl.textContent = 'Something went wrong connecting to the database. See README.md for setup steps.';
        errEl.style.display = 'block';
      }
    });
  }

      const household = {

        errEl.textContent = 'Could not reach the database. Check your Firebase config and Firestore rules (see README.md).';
        errEl.style.display = 'block';
      }
    });
  }

  /* ---------------- Stats / derived data ---------------- */
  function isOngoing(e){
    if(e.type!=='illness' && e.type!=='medication') return false;
    if(!e.detail2) return true;
    return new Date(e.detail2+'T00:00:00') >= startOfToday();
  }
  function getReminders(events){
    const items = [];
    events.forEach(e=>{
      if(e.type==='appointment' && new Date(e.date+'T00:00:00') >= startOfToday()){
        items.push({ date:e.date, label:e.title, sub:'Appointment', memberId:e.memberId });
      }
      if(e.type==='vaccine' && e.detail2 && new Date(e.detail2+'T00:00:00') >= startOfToday()){
        items.push({ date:e.detail2, label:e.title+' — next dose', sub:'Vaccine due', memberId:e.memberId });
      }
    });
    items.sort((a,b)=> new Date(a.date) - new Date(b.date));
    return items;
  }
  function computeStats(events){
    const now = new Date();
    const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endMonth = new Date(now.getFullYear(), now.getMonth()+1, 1);
    const thisMonth = events.filter(e=>{
      const d = new Date(e.date+'T00:00:00');
      return d >= startMonth && d < endMonth;
    }).length;
    const active = events.filter(isOngoing).length;
    const upcoming = getReminders(events).length;
    return { thisMonth, active, upcoming, members: state.household.members.length };
  }

  function renderGrowthPanel(){
    const panel = document.getElementById('fht-growth-panel');
    if(!panel) return;
    if(charts.height) { charts.height.destroy(); charts.height = null; }
    if(charts.weight) { charts.weight.destroy(); charts.weight = null; }
    if(state.activeFilter==='all'){
      panel.innerHTML = `<div class="fht-section-head"><h2>Growth</h2></div><div class="fht-empty" style="padding:14px;">Select a person above to see their growth chart.</div>`;
      return;
    }
    const member = getMember(state.activeFilter);
    const entries = state.events
      .filter(e=>e.type==='growth' && e.memberId===state.activeFilter && (e.heightCm || e.weightKg))
      .sort((a,b)=> new Date(a.date)-new Date(b.date));
    if(entries.length===0){
      panel.innerHTML = `<div class="fht-section-head"><h2>Growth</h2></div><div class="fht-empty" style="padding:14px;">No growth measurements logged for ${esc(member.name)} yet.</div>`;
      return;
    }
    const units = state.household.measurementUnits;
    const latest = entries[entries.length-1];
    const latestBmi = (latest.heightCm && latest.weightKg) ? (latest.weightKg/((latest.heightCm/100)**2)).toFixed(1) : null;
    panel.innerHTML = `
      <div class="fht-section-head"><h2>Growth — ${esc(member.name)}</h2></div>
      <div class="fht-growth-stat">
        ${latest.heightCm ? `<div>Latest height<span>${fromCm(latest.heightCm, units).toFixed(1)} ${unitSuffix().h}</span></div>` : ''}
        ${latest.weightKg ? `<div>Latest weight<span>${fromKg(latest.weightKg, units).toFixed(1)} ${unitSuffix().w}</span></div>` : ''}
        ${latestBmi ? `<div>BMI<span>${latestBmi}</span></div>` : ''}
      </div>
      <canvas id="fht-chart-height" height="120"></canvas>
      <div style="height:14px;"></div>
      <canvas id="fht-chart-weight" height="120"></canvas>
      <p class="fht-note" style="margin-top:10px;">BMI shown for reference only — ask your pediatrician about percentile ranges for your child's age.</p>
    `;
    const labels = entries.map(e=>fmtDate(e.date));
    charts.height = new Chart(document.getElementById('fht-chart-height').getContext('2d'), {

  function exportCSV(){
    const rows = [['Date','Person','Type','Title','Detail 1','Detail 2','Notes']];
    [...state.events].sort((a,b)=> new Date(a.date)-new Date(b.date)).forEach(e=>{
      const member = getMember(e.memberId);
      rows.push([e.date, member.name, TYPE_CONFIG[e.type].label, e.title, e.detail1||'', e.detail2||'', e.notes||'']);
    });
    const csv = rows.map(r=> r.map(cell=>{
      const s = String(cell==null?'':cell);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\r\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${state.household.name.replace(/[^a-z0-9]+/gi,'-')}-health-events.csv`;

  async function handleRestoreFile(e){
    const file = e.target.files[0];
    if(!file) return;
    e.target.value = '';
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data.household || !Array.isArray(data.events)) throw new Error('Unrecognized backup file');
      const proceed = confirm(`This will REPLACE all current data for "${state.household.name}" with the backup (${data.events.length} events). This cannot be undone. Continue?`);
      if(!proceed) return;
      await setDoc(householdRef(state.code), data.household);
      const existing = await getDocs(eventsRef(state.code));
      let batch = writeBatch(db);
      let opCount = 0;
      for(const d of existing.docs){
        batch.delete(d.ref);
        opCount++;
        if(opCount>=450){ await batch.commit(); batch = writeBatch(db); opCount=0; }
      }
      for(const ev of data.events){
        const { id, ...fields } = ev;
        batch.set(id ? eventRef(state.code, id) : doc(eventsRef(state.code)), fields);
        opCount++;
        if(opCount>=450){ await batch.commit(); batch = writeBatch(db); opCount=0; }
      }
      if(opCount>0) await batch.commit();
      alert('Backup restored.');
    } catch(err){
      console.error(err);
      alert("Could not restore that file — make sure it's a backup downloaded from this app.");
    }
  }

        const hay = [e.title, e.notes, e.detail1, e.detail2].join(' ').toLowerCase();

  function renderTimeline(events){
    const wrap = document.getElementById('fht-timeline');
    if(events.length===0){
      wrap.innerHTML = `<div class="fht-empty">No events yet. Log your first health event to start building this record.</div>`;
      return;
    }
    const sorted = [...events].sort((a,b)=> new Date(b.date) - new Date(a.date));
    let currentMonth = null;
    let html = '';
    sorted.forEach(e=>{
      const monthLabel = fmtMonthHead(e.date);
      if(monthLabel !== currentMonth){
        html += `<div class="fht-month-head">${monthLabel}</div>`;
        currentMonth = monthLabel;
      }
      const cfg = TYPE_CONFIG[e.type];
      const member = getMember(e.memberId);
      let detailLine = '';
      if(e.type==='growth'){
        const u = unitSuffix();
        const parts = [];
        if(e.detail1) parts.push(`Height: ${esc(e.detail1)} ${u.h}`);
        if(e.detail2) parts.push(`Weight: ${esc(e.detail2)} ${u.w}`);
        if(e.heightCm && e.weightKg) parts.push(`BMI: ${(e.weightKg/((e.heightCm/100)**2)).toFixed(1)}`);
        detailLine = parts.length ? `<div class="fht-entry-detail">${parts.join(' · ')}</div>` : '';
      } else if(e.detail1){
        detailLine = `<div class="fht-entry-detail">${cfg.d1Label}: ${esc(e.detail1)}</div>`;
      }
      html += `
        <div class="fht-entry" style="--type-color:${cfg.hex}" data-id="${e.id}">
          <div class="fht-shape">${cfg.shape}</div>
          ${e.photoURL ? (e.photoType==='pdf'

    });

        if(ev.target.classList.contains('fht-entry-del')) return;

        if(state.readOnly) return;
        const e = state.events.find(x=>x.id===row.dataset.id);

      });
    });

      wrap.querySelectorAll('.fht-entry-del').forEach(btn=>{
        btn.addEventListener('click', async (ev)=>{
          ev.stopPropagation();
          if(btn.dataset.armed==='1'){
            try{
              const e = state.events.find(x=>x.id===btn.dataset.id);
              if(e && e.photoURL) deleteObject(storageRef(storage, e.photoURL)).catch(()=>{});
              await deleteEventRemote(btn.dataset.id);
            } catch(e){ console.error(e); }
          } else {
            btn.dataset.armed = '1';
            btn.textContent = 'Confirm?';
            setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed='0'; btn.textContent='×'; } }, 2500);
          }
        });
      });
    }
  }

  function lastNMonths(n){
    const out = [];
    const now = new Date();
    for(let i=n-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      out.push({ year:d.getFullYear(), month:d.getMonth(), label: d.toLocaleDateString(undefined,{month:'short'}) });
    }
    return out;
  }

  function renderMonthlyChart(events){
    const months = lastNMonths(6);
    const types = Object.keys(TYPE_CONFIG);
    const datasets = types.map(t=>({
      label: TYPE_CONFIG[t].label,
      backgroundColor: TYPE_CONFIG[t].hex,
      data: months.map(m=> events.filter(e=>{
        const d = new Date(e.date+'T00:00:00');
        return e.type===t && d.getFullYear()===m.year && d.getMonth()===m.month;
      }).length),
      borderRadius: 3,
    }));
    if(charts.monthly) charts.monthly.destroy();
    const ctx = document.getElementById('fht-chart-monthly').getContext('2d');
    charts.monthly = new Chart(ctx, {
      type: 'bar',
      data: { labels: months.map(m=>m.label), datasets },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: true, grid: { display:false }, ticks: { color:'#7A7061', font:{ family:'Inter' } } },
          y: { stacked: true, beginAtZero: true, ticks: { precision:0, color:'#7A7061', font:{ family:'Inter' } }, grid: { color:'#DDD1B4' } }
        }
      }
    });
    const legend = document.getElementById('fht-legend-monthly');
    legend.innerHTML = types.map(t=>`
      <span class="fht-legend-item"><span class="fht-dot" style="background:${TYPE_CONFIG[t].hex}"></span>${TYPE_CONFIG[t].label}</span>
    `).join('');
  }

  function renderSecondChart(events){
    const titleEl = document.getElementById('fht-second-title');
    if(charts.second) charts.second.destroy();
    const ctx = document.getElementById('fht-chart-second').getContext('2d');
    if(state.activeFilter==='all'){
      titleEl.textContent = 'By person';
      const members = state.household.members;

    } else {
      titleEl.textContent = 'By event type';

  function getOngoingMedications(events){
    return events.filter(e=> e.type==='medication' && e.frequency && isOngoing(e));
  }

  function renderReminders(events){
    const wrap = document.getElementById('fht-reminders');
    const meds = getOngoingMedications(events);
    const items = getReminders(events).slice(0,5);
    const medsHtml = meds.length ? `
      <div class="fht-note" style="margin:0 0 4px 0; font-weight:600;">Ongoing medications</div>
      ${meds.map(m=>{
        const member = getMember(m.memberId);
        return `<div class="fht-remind-item"><span>${esc(m.title)} — ${esc(m.frequency)} <span style="color:var(--ink-soft);">— ${esc(member.name)}</span></span></div>`;
      }).join('')}
    ` : '';
    if(items.length===0 && meds.length===0){
      wrap.innerHTML = `<div class="fht-empty" style="padding:14px;">Nothing scheduled right now.</div>`;
      return;
    }
    if(items.length===0){
      wrap.innerHTML = medsHtml;
      return;
    }
    wrap.innerHTML = medsHtml + items.map((it,i)=>{
      const member = getMember(it.memberId);
      return `
        <div class="fht-remind-item">
          <span>${esc(it.label)} <span style="color:var(--ink-soft);">— ${esc(member.name)}</span></span>
          <span style="display:flex; align-items:center; gap:8px;">
            <span class="fht-r-date">${fmtDate(it.date)}</span>
            <button class="fht-btn-text" data-idx="${i}" title="Add to calendar" style="padding:2px 4px;">+Cal</button>
          </span>
        </div>
      `;
    }).join('');
    wrap.querySelectorAll('button[data-idx]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const it = items[+btn.dataset.idx];
        downloadICS(it.label, it.date, it.sub);
      });

  }

  function downloadICS(title, dateISO, description){
    const dt = dateISO.replace(/-/g, '');
    const uid = uidLocal() + '@family-health-record';
    const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    const escText = (s)=> String(s||'').replace(/[\n]/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Health Record//EN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dt}`,
      `SUMMARY:${escText(title)}`,
      description ? `DESCRIPTION:${escText(description)}` : '',
      'END:VEVENT','END:VCALENDAR'
    ].filter(Boolean).join('\r\n');
    const blob = new Blob([ics], { type:'text/calendar' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = title.replace(/[^a-z0-9]+/gi,'-').slice(0,40) + '.ics';
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
  }

  function fieldLabel(key){
    const cfg = TYPE_CONFIG[modalState.type];

      document.getElementById('fht-m-freq').addEventListener('change', e=>{ modalState.frequency = e.target.value || null; });
    }

    if(modalState.id){
      document.getElementById('fht-m-delete').addEventListener('click', async (e)=>{
        if(modalDeleteArm){
          try{
            if(modalState.photoURL) deleteObject(storageRef(storage, modalState.photoURL)).catch(()=>{});
            await deleteEventRemote(modalState.id);
            closeModal();
          } catch(err){ console.error(err); }
        } else {
          modalDeleteArm = true;
          e.target.textContent = 'Click again to delete';
        }
      });
    }
    document.getElementById('fht-m-save').addEventListener('click', async ()=>{
      const errEl = document.getElementById('fht-m-error');
      if(!modalState.title.trim() || !modalState.date){
        errEl.textContent = 'Please add what happened and a date.';
        errEl.style.display = 'block';
        return;
      }
      const saveBtn = document.getElementById('fht-m-save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const fields = {
        memberId: modalState.memberId,
        type: modalState.type,
        title: modalState.title.trim(),
        date: modalState.date,
        detail1: modalState.detail1 || '',
        detail2: modalState.detail2 || (modalState.type==='growth' ? '' : null),
        notes: modalState.notes || '',
        frequency: modalState.type==='medication' ? (modalState.frequency || null) : null,
        loggedBy: currentUser ? (currentUser.displayName || currentUser.email || null) : null
      };
      if(modalState.type==='growth'){
        const units = state.household.measurementUnits;
        const h = parseFloat(modalState.detail1);
        const w = parseFloat(modalState.detail2);
        fields.heightCm = isFinite(h) ? Math.round(toCm(h, units)*10)/10 : null;
        fields.weightKg = isFinite(w) ? Math.round(toKg(w, units)*100)/100 : null;
      }
      try{
        let eventId = modalState.id;
        if(!eventId){
          const ref = await addEventRemote(fields);
          eventId = ref.id;
        } else {
          await updateEventRemote(eventId, fields);
        }
        if(modalState.removePhoto && modalState.photoURL){
          deleteObject(storageRef(storage, modalState.photoURL)).catch(()=>{});
          await updateEventRemote(eventId, { photoURL: null });
        }
        if(modalState.photoFile){
          const isPdf = modalState.photoType==='pdf';
          const path = `households/${state.code}/events/${eventId}/photo-${Date.now()}.${isPdf?'pdf':'jpg'}`;
          const ref = storageRef(storage, path);
          await uploadBytes(ref, modalState.photoFile);
          const url = await getDownloadURL(ref);
          await updateEventRemote(eventId, { photoURL: url, photoType: isPdf ? 'pdf' : 'image' });
        }
        closeModal();
      } catch(err){
        console.error(err);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        errEl.textContent = 'Could not save — check your connection and try again.';
        errEl.style.display = 'block';
      }
    });
  }

  function renderDetailField(fieldKey){

      wrap.innerHTML = `
        <label for="${inputId}">${label}</label>

          <option value="">Select…</option>
          ${cfg[fieldKey+'Options'].map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}
        </select>
      `;

        <label for="${inputId}">${label}</label>

      `;

      wrap.innerHTML = `
        <label for="${inputId}">${label}</label>

            <select class="fht-condition-type" data-idx="${i}">
              <option value="allergy">Allergy</option>
              <option value="condition">Condition</option>
            </select>
            <input type="text" class="fht-condition-input" data-idx="${i}" placeholder="e.g. Peanut allergy, Asthma" />
            <button type="button" class="fht-btn-text fht-condition-addbtn" data-idx="${i}">+ Add</button>
          </div>
          <button type="button" class="fht-care-toggle" data-idx="${i}">${m._careOpen ? 'Hide care info ▲' : 'Care & insurance info ▾'}</button>
          ${m._careOpen ? `
            <div class="fht-care-grid">
              ${CARE_FIELDS.map(([key,label])=>`
                <input type="text" placeholder="${label}" data-idx="${i}" data-key="${key}" class="fht-care-field" value="${esc(m.care[key]||'')}" />
              `).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
      document.querySelectorAll('.fht-people-row .fht-swatch').forEach(sw=>{
        sw.addEventListener('click', e=>{ peopleDraft.members[+e.target.dataset.idx].color = e.target.dataset.color; renderRows(); });
      });
      document.querySelectorAll('.fht-people-name').forEach(inp=>{
        inp.addEventListener('input', e=>{ peopleDraft.members[+e.target.dataset.idx].name = e.target.value; });
      });
      document.querySelectorAll('.fht-people-bd').forEach(inp=>{
        inp.addEventListener('change', e=>{ peopleDraft.members[+e.target.dataset.idx].birthdate = e.target.value || null; });
      });
      document.querySelectorAll('.fht-condition-addbtn').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const idx = +e.target.dataset.idx;
          const row = e.target.closest('.fht-people-block');
          const input = row.querySelector('.fht-condition-input');
          const typeSel = row.querySelector('.fht-condition-type');
          const label = input.value.trim();
          if(!label) return;
          if(!peopleDraft.members[idx].conditions) peopleDraft.members[idx].conditions = [];
          peopleDraft.members[idx].conditions.push({ id: uidLocal(), label, type: typeSel.value });
          renderRows();
        });
      });
      document.querySelectorAll('.fht-condition-remove').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const idx = +e.target.dataset.idx, ci = +e.target.dataset.ci;
          peopleDraft.members[idx].conditions.splice(ci,1);
          renderRows();
        });
      });
      document.querySelectorAll('.fht-care-toggle').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const m = peopleDraft.members[+e.target.dataset.idx];
          m._careOpen = !m._careOpen;
          renderRows();
        });
      });
      document.querySelectorAll('.fht-care-field').forEach(inp=>{
        inp.addEventListener('input', e=>{
          peopleDraft.members[+e.target.dataset.idx].care[e.target.dataset.key] = e.target.value;
        });
      });
      document.querySelectorAll('.fht-people-row .fht-remove-row').forEach(btn=>{
        btn.addEventListener('click', e=>{ peopleDraft.members.splice(+e.target.dataset.idx,1); renderRows(); });
      });
    }
    renderRows();

    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closePeopleModal(); });
    document.getElementById('fht-people-cancel').addEventListener('click', closePeopleModal);
    document.getElementById('fht-people-add').addEventListener('click', ()=>{
      if(peopleDraft.members.length>=8) return;
      peopleDraft.members.push({ id: uidLocal(), name:'', color: PALETTE[peopleDraft.members.length % PALETTE.length], birthdate:null, care:{}, conditions:[] });
      renderRows();
    });
    document.getElementById('fht-people-save').addEventListener('click', async ()=>{
      const errEl = document.getElementById('fht-people-error');
      if(peopleDraft.members.some(m=>!m.name.trim())){
        errEl.textContent = 'Every person needs a name.';
        errEl.style.display = 'block';
        return;
      }
      state.household.measurementUnits = peopleDraft.measurementUnits;
      state.household.members = peopleDraft.members.map(m=>{
        const { _careOpen, ...clean } = m;
        return { ...clean, name: m.name.trim() };
      });
      try{
        await saveHouseholdRemote();
        closePeopleModal();
      } catch(err){
        console.error(err);
        errEl.textContent = 'Could not save — check your connection and try again.';
        errEl.style.display = 'block';
      }
    });
  }
  function closePeopleModal(){
    const overlay = document.getElementById('fht-people-overlay');
    if(overlay) overlay.remove();
    peopleDraft = null;
  }

  /* ---------------- Init ---------------- */
  async function init(){
    const params = new URLSearchParams(location.search);
    const urlCode = params.get('code');
    const isViewLink = params.get('view')==='1';
    history.replaceState({}, '', location.pathname);

    if(urlCode){
      try{
        if(isViewLink){
          const voSnap = await getDoc(doc(db,'viewOnlyCodes',urlCode.toUpperCase()));
          if(!voSnap.exists()){ renderGate('missing'); return; }
          const familyCode = voSnap.data().familyCode;
          const hSnap = await getDoc(householdRef(familyCode));
          if(!hSnap.exists()){ renderGate('missing'); return; }
          state.code = familyCode;
          state.readOnly = true;
          localStorage.setItem(CODE_KEY, familyCode);
          localStorage.setItem(READONLY_KEY, '1');
          startListening();
          return;
        } else {
          const snap = await getDoc(householdRef(urlCode.toUpperCase()));
          if(!snap.exists()){ renderGate('missing'); return; }
          state.code = urlCode.toUpperCase();
          state.readOnly = false;
          localStorage.setItem(CODE_KEY, urlCode.toUpperCase());
          localStorage.removeItem(READONLY_KEY);
          startListening();
          return;
        }
      } catch(e){
        console.error(e);
        renderGate('error');
        return;
      }
    }

    const savedCode = localStorage.getItem(CODE_KEY);
    if(!savedCode){
      renderGate();
      return;
    }
    try{
      const snap = await getDoc(householdRef(savedCode));
      if(!snap.exists()){
        localStorage.removeItem(CODE_KEY);
        renderGate();
        return;
      }
      state.code = savedCode;
      state.readOnly = localStorage.getItem(READONLY_KEY)==='1';
      startListening();
    } catch(e){
      console.error(e);
      renderGate('error');
    }
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline shell is a bonus, not required */ });
    });
  }
})();
</script>
</body>
</html>
